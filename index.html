<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LELEO's Personal Page</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入图标库（可选，示例用Font Awesome） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 背景图容器 -->
    <div class="bg-container"></div>

    <!-- 顶部标题 -->
    <header class="header">
        <h1>HI, I'M LELEO</h1>
    </header>

    <!-- 左侧头像与社交图标 -->
    <div class="avatar-section">
        <img src="avatar.png" alt="头像" class="avatar">
        <div class="social-icons">
            <a href="#"><<i class="fab fa-github"></</i></a>
            <a href="#"><<i class="fab fa-bilibili"></</i></a>
            <a href="#"><<i class="fab fa-twitter"></</i></a>
        </div>
    </div>

    <!-- 搜索框 -->
    <div class="search-box">
        <select class="search-engine">
            <option value="bing">BING</option>
            <option value="google">GOOGLE</option>
        </select>
        <input type="text" placeholder="搜索...">
        <button class="search-btn"><<i class="fas fa-search"></</i></button>
    </div>

    <!-- 时间与日期 -->
    <div class="time-section">
        <div class="time" id="time">00:00:00</div>
        <div class="date" id="date">2025年12月06日 星期六</div>
        <div class="circle-animation"></div>
    </div>

    <!-- 名言警句 -->
    <div class="quote">“生命太短，没有时间留给遗憾，若不是终点”</div>

    <!-- 功能卡片区域 -->
    <div class="cards-container">
        <div class="card">
            <h3>博客</h3>
            <p>写不了一点</p>
            <a href="#" class="card-btn">前往</a>
        </div>
        <div class="card">
            <h3>网盘</h3>
            <p>云端的百宝箱，数据的避风港</p>
            <a href="#" class="card-btn">前往</a>
        </div>
        <div class="card">
            <h3>二级域名</h3>
            <p>免费获取本站二级域名</p>
            <a href="#" class="card-btn">前往</a>
        </div>
        <div class="card">
            <h3>赛博要饭</h3>
            <p>赛博要饭-科技化缘 一码在手-天下我有</p>
            <a href="#" class="card-btn">前往</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
